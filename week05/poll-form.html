<!DOCTYPE html>
<html lang="en">
<header>
    <main>
        <form>
            <label for="fullname">Full Name: </label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>

            <label for="favorite">What's your favorite browser?</label>
            <select name="favorite" id="favorite">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="3">Edge</option>
                <option value="4">Brave</option>
                <option value="5">Other</option>
            </select>

            <label>Do you have a household pet? <input type="checkbox" id="pet" name="pet"></label>

            <label for="feedback">List the places you have lived </label>
            <textarea type="feedback" id="feedback" name="feedback" rows="4"
              placeholder="USA, UK, UAE"></textarea>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>&copy; | HTML Form - Uer Poll Activity | Elizabeth Shonibare</footer>
</header>

</html>
