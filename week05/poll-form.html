<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <form>
        <div class="form-item column2">
            <label for="fullname">Full Name: </label>
            <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="form-item column2">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

        </div>
        <div class="form-item">
            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>
        <div class="form-item">
            <label for="favorite">What's your favorite browser?</label>
            <select name="favorite" id="favorite">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="3">Edge</option>
                <option value="4">Brave</option>
                <option value="5">Other</option>
            </select>
        </div>
        <div class="form-item">
            <label>Do you have a household pet? <input type="checkbox" id="pet" name="pet"></label>
        </div>
        <div class="form-item">
            <label for="feedback">List the places you have lived </label>
            <textarea type="feedback" id="feedback" name="feedback" rows="4"
              placeholder="USA, UK, UAE"></textarea>
        </div>

        <button type="submit">Submit Poll</button>
    </form>
    </main>
    <footer>©️ 2026 | HTML Form - User Poll Activity | Elizabeth Shonibare</footer>

</body>

</html>
